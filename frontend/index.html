<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GlowCoach</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header>
      <h1>GlowCoach</h1>
      <p>Your motivational AI partner.</p>
    </header>

    <main id="chat-box">
      <div class="message coach">
        <strong>GlowCoach:</strong>
        Hey, I’m GlowCoach. Tell me what you're trying to improve right now.
      </div>
    </main>

    <form id="chat-form">
      <input
        type="text"
        id="message-input"
        placeholder="Type your message..."
        autocomplete="off"
        required
      />
      <button type="submit">Send</button>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
